[project]
name = "GitDrive"
version = "4.0.0"
description = "GitDrive - encrypted cloud storage on GitHub"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "pymongo>=4.10",
    "cryptography>=45.0.0",
    "pyjwt>=2.9",
    "stream-zip>=0.0.83",
]

[dependency-groups]
dev = ["pytest>=8", "mongomock>=4.3"]
