<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="refactored-carnival">
  <title>refactored-carnival</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #07070f;
      --surface:   rgba(255,255,255,0.035);
      --surface-h: rgba(255,255,255,0.065);
      --border:    rgba(255,255,255,0.07);
      --border-s:  rgba(255,255,255,0.14);
      --violet:    #7c3aed;
      --violet-l:  #a78bfa;
      --indigo:    #4f46e5;
      --text:      #f1f5f9;
      --text-2:    #94a3b8;
      --text-3:    #475569;
      --ok:        #10b981;
      --err:       #ef4444;
      --r:         12px;
      --r-s:       8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 70% 50% at 5% 0%,   rgba(124,58,237,.13) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 95% 100%, rgba(79,70,229,.08)  0%, transparent 55%);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(7,7,15,.85);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -.4px;
    }

    .logo-mark {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, var(--violet), var(--indigo));
      border-radius: 8px;
      display: grid; place-items: center;
      font-size: 14px;
    }

    .header-stats { display: flex; align-items: center; gap: 28px; }
    .stat { text-align: right; }
    .stat-val { font-size: 14px; font-weight: 600; color: var(--violet-l); }
    .stat-lbl { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; }
    .repo-pills { display: flex; gap: 6px; }
    .repo-pill {
      padding: 2px 9px; border-radius: 99px;
      font-size: 10px; font-weight: 600;
      background: rgba(124,58,237,.15);
      border: 1px solid rgba(124,58,237,.3);
      color: var(--violet-l);
      font-family: 'JetBrains Mono', monospace;
    }

    main { max-width: 920px; margin: 0 auto; padding: 44px 24px 80px; }

    #dropZone {
      border: 2px dashed var(--border-s);
      border-radius: var(--r);
      padding: 52px 32px;
      text-align: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      background: var(--surface);
      transition: border-color .2s, transform .15s;
      margin-bottom: 28px;
    }
    #dropZone::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(124,58,237,.07), rgba(79,70,229,.07));
      opacity: 0; transition: opacity .2s;
    }
    #dropZone:hover        { border-color: var(--violet); }
    #dropZone:hover::after { opacity: 1; }
    #dropZone.over         { border-color: var(--violet-l); transform: scale(1.004); }
    #dropZone.over::after  { opacity: 1; }

    .dz-icon {
      width: 52px; height: 52px;
      margin: 0 auto 18px;
      background: rgba(124,58,237,.18);
      border-radius: 14px;
      display: grid; place-items: center;
      font-size: 22px;
      position: relative; z-index: 1;
    }
    .dz-title { font-size: 17px; font-weight: 600; margin-bottom: 6px; position: relative; z-index: 1; }
    .dz-sub   { font-size: 13px; color: var(--text-2); position: relative; z-index: 1; }
    #fileInput { display: none; }

    #uploadCard {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 18px 22px;
      margin-bottom: 28px;
    }
    #uploadCard.visible { display: block; }

    .prog-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .prog-name {
      font-size: 13px; font-weight: 500;
      max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .prog-label { font-size: 12px; color: var(--text-2); }

    .bar-track {
      height: 5px;
      background: rgba(255,255,255,.07);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%; width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--violet), var(--violet-l));
      transition: width .3s ease;
    }
    .bar-fill.ok  { background: linear-gradient(90deg, #059669, var(--ok)); }
    .bar-fill.err { background: var(--err); }

    .prog-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 6px;
    }
    .prog-chunk { font-size: 10px; color: var(--text-3); font-family: 'JetBrains Mono', monospace; }
    .prog-speed { font-size: 10px; color: var(--violet-l); font-family: 'JetBrains Mono', monospace; font-weight: 500; }

    .sync-row {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .sync-label-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px;
    }
    .sync-lbl { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; }
    .sync-pct { font-size: 10px; font-family: 'JetBrains Mono', monospace; color: var(--indigo); }
    .sync-track { height: 3px; background: rgba(255,255,255,.05); border-radius: 99px; overflow: hidden; }
    .sync-fill  {
      height: 100%; width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--indigo), var(--violet-l));
      transition: width .4s ease;
    }
    .sync-fill.ok { background: linear-gradient(90deg, #059669, var(--ok)); }

    .sec-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .sec-title { font-size: 15px; font-weight: 600; }

    #searchBox {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-s);
      padding: 7px 13px;
      color: var(--text); font-family: inherit; font-size: 13px;
      width: 210px; outline: none;
      transition: border-color .2s;
    }
    #searchBox:focus { border-color: var(--violet); }
    #searchBox::placeholder { color: var(--text-3); }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead { background: rgba(255,255,255,.025); border-bottom: 1px solid var(--border); }
    th {
      padding: 11px 16px; text-align: left;
      font-size: 10.5px; font-weight: 500;
      text-transform: uppercase; letter-spacing: .5px;
      color: var(--text-3);
    }
    td { padding: 13px 16px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,.035); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .12s; }
    tbody tr:hover td { background: var(--surface-h); }

    .fname { font-weight: 500; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fsha  { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); letter-spacing: .2px; }
    .fsz   { color: var(--text-2); white-space: nowrap; }

    .badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 99px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
    .b-chunk  { background: rgba(124,58,237,.18); color: var(--violet-l); }
    .b-single { background: rgba(79,70,229,.14);  color: #818cf8; }

    .btn-dl {
      background: transparent;
      border: 1px solid var(--border-s);
      color: var(--text-2);
      padding: 5px 13px; border-radius: var(--r-s);
      cursor: pointer; font-size: 12px; font-family: inherit; font-weight: 500;
      transition: background .18s, border-color .18s, color .18s;
      display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    }
    .btn-dl:hover:not(:disabled) { background: var(--violet); border-color: var(--violet); color: #fff; }
    .btn-dl:disabled { opacity: .45; cursor: not-allowed; }

    .dl-prog-row td { padding: 0 16px 10px; }
    .dl-bar-track { height: 3px; background: rgba(255,255,255,.05); border-radius: 99px; overflow: hidden; }
    .dl-bar-fill  { height: 100%; width: 0%; background: linear-gradient(90deg, var(--indigo), var(--violet-l)); border-radius: 99px; transition: width .2s ease; }

    .empty { padding: 60px 24px; text-align: center; color: var(--text-3); font-size: 14px; }
    .empty-icon { font-size: 32px; margin-bottom: 10px; opacity: .4; }

    #toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 999; }
    .toast {
      background: rgba(10,10,20,.96);
      border: 1px solid var(--border);
      border-radius: var(--r-s);
      padding: 11px 16px; font-size: 13px; max-width: 290px;
      backdrop-filter: blur(14px);
      animation: toastIn .18s ease;
    }
    .toast.ok  { border-left: 3px solid var(--ok);       }
    .toast.err { border-left: 3px solid var(--err);      }
    .toast.inf { border-left: 3px solid var(--violet-l); }
    @keyframes toastIn { from { transform: translateX(16px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    @media (max-width: 620px) {
      header { padding: 14px 16px; }
      .header-stats { display: none; }
      main { padding: 28px 14px 60px; }
      th:nth-child(3), td:nth-child(3),
      th:nth-child(4), td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">⬡</div>
    GDrive
  </div>
  <div class="header-stats">
    <div class="stat">
      <div class="stat-val" id="statFiles">—</div>
      <div class="stat-lbl">Files</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="statSize">—</div>
      <div class="stat-lbl">Stored</div>
    </div>
    <div class="repo-pills" id="repoPills"></div>
  </div>
</header>

<main>

  <div id="dropZone">
    <input type="file" id="fileInput" multiple>
    <div class="dz-icon">↑</div>
    <div class="dz-title">Drop files here</div>
    <div class="dz-sub">or click to browse ....any size, any format</div>
  </div>

  <div id="uploadCard">
    <div class="prog-row">
      <span class="prog-name"  id="progName">—</span>
      <span class="prog-label" id="progLabel">Preparing…</span>
    </div>
    <div class="bar-track">
      <div class="bar-fill" id="progFill"></div>
    </div>
    <div class="prog-meta">
      <span class="prog-chunk" id="progChunk"></span>
      <span class="prog-speed" id="progSpeed"></span>
    </div>
    <div class="sync-row" id="syncRow" style="display:none">
      <div class="sync-label-row">
        <span class="sync-lbl">GitHub sync</span>
        <span class="sync-pct" id="syncPct">0%</span>
      </div>
      <div class="sync-track">
        <div class="sync-fill" id="syncFill"></div>
      </div>
    </div>
  </div>

  <div class="sec-head">
    <span class="sec-title">Files</span>
    <input id="searchBox" type="search" placeholder="Search by name or hash">
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Name</th><th>Size</th><th>SHA-256</th><th>Chunks</th><th></th>
        </tr>
      </thead>
      <tbody id="filesBody">
        <tr><td colspan="5"><div class="empty"><div class="empty-icon">⋯</div>Loading…</div></td></tr>
      </tbody>
    </table>
  </div>

</main>

<div id="toasts"></div>

<script>
  const CHUNK_SIZE = 10 * 1024 * 1024;
  let allFiles = [];

  function fmt(n) {
    if (n < 1024)       return n + ' B';
    if (n < 1048576)    return (n / 1024).toFixed(1) + ' KB';
    if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
    return (n / 1073741824).toFixed(2) + ' GB';
  }

  function fmtSpeed(bps) {
    if (bps < 1024)    return bps.toFixed(0) + ' B/s';
    if (bps < 1048576) return (bps / 1024).toFixed(1) + ' KB/s';
    return (bps / 1048576).toFixed(1) + ' MB/s';
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function toast(msg, type = 'inf', ms = 4500) {
    const el = Object.assign(document.createElement('div'), {
      className:   `toast ${type}`,
      textContent: msg,
    });
    document.getElementById('toasts').append(el);
    setTimeout(() => el.remove(), ms);
  }

  function updateStats() {
    const total = allFiles.reduce((s, f) => s + (f.size_bytes || 0), 0);
    document.getElementById('statFiles').textContent = allFiles.length;
    document.getElementById('statSize').textContent  = fmt(total);
    const repos = [...new Set(allFiles.map(f => f.repo).filter(Boolean))];
    document.getElementById('repoPills').innerHTML =
      repos.map(r => `<span class="repo-pill">${esc(r)}</span>`).join('');
  }

  async function loadFiles() {
    try {
      allFiles = await fetch(`/files?t=${Date.now()}`).then(r => r.json());
      renderFiles(allFiles);
      updateStats();
    } catch {
      toast('Could not load file list', 'err');
    }
  }

  function renderFiles(list) {
    const body = document.getElementById('filesBody');
    if (!list.length) {
      body.innerHTML = `<tr><td colspan="5"><div class="empty"><div class="empty-icon">○</div>No files yet</div></td></tr>`;
      return;
    }
    body.innerHTML = list.map(f => {
      const sha  = f.sha256;
      const badge = f.is_chunked
        ? `<span class="badge b-chunk">${f.chunk_count}×</span>`
        : `<span class="badge b-single">1</span>`;
      const sz   = f.size_bytes || 0;
      const mime = esc(f.mime_type || 'application/octet-stream');
      return `
        <tr id="fr-${sha}">
          <td><div class="fname" title="${esc(f.original_filename)}">${esc(f.original_filename)}</div></td>
          <td class="fsz">${fmt(sz)}</td>
          <td><span class="fsha">${sha.slice(0,10)}…${sha.slice(-4)}</span></td>
          <td>${badge}</td>
          <td>
            <button class="btn-dl" id="dlbtn-${sha}"
              onclick="startDownload('${sha}','${esc(f.original_filename)}','${mime}',${sz})">
              ↓ Download
            </button>
          </td>
        </tr>
        <tr class="dl-prog-row" id="dlrow-${sha}" style="display:none">
          <td colspan="5">
            <div class="dl-bar-track">
              <div class="dl-bar-fill" id="dlbar-${sha}"></div>
            </div>
          </td>
        </tr>`;
    }).join('');
  }

  document.getElementById('searchBox').addEventListener('input', function () {
    const q = this.value.toLowerCase();
    renderFiles(allFiles.filter(f =>
      f.original_filename.toLowerCase().includes(q) || f.sha256.includes(q)
    ));
  });

  const dropZone  = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');

  dropZone.addEventListener('click',     () => fileInput.click());
  dropZone.addEventListener('dragover',  e  => { e.preventDefault(); dropZone.classList.add('over'); });
  dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('over');
    [...e.dataTransfer.files].forEach(upload);
  });
  fileInput.addEventListener('change', () => {
    [...fileInput.files].forEach(upload);
    fileInput.value = '';
  });

  function resetCard() {
    const fill     = document.getElementById('progFill');
    const syncRow  = document.getElementById('syncRow');
    const syncFill = document.getElementById('syncFill');
    fill.className    = 'bar-fill';
    fill.style.width  = '0%';
    syncRow.style.display = 'none';
    syncFill.className    = 'sync-fill';
    syncFill.style.width  = '0%';
    document.getElementById('progChunk').textContent = '';
    document.getElementById('progSpeed').textContent = '';
    document.getElementById('syncPct').textContent   = '0%';
  }

  async function upload(file) {
    const card     = document.getElementById('uploadCard');
    const fill     = document.getElementById('progFill');
    const name     = document.getElementById('progName');
    const label    = document.getElementById('progLabel');
    const chunk    = document.getElementById('progChunk');
    const speed    = document.getElementById('progSpeed');
    const syncRow  = document.getElementById('syncRow');
    const syncFill = document.getElementById('syncFill');
    const syncPct  = document.getElementById('syncPct');

    card.classList.add('visible');
    resetCard();
    name.textContent  = file.name;
    label.textContent = 'Starting…';

    const uploadId    = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });
    const totalChunks = Math.max(1, Math.ceil(file.size / CHUNK_SIZE));
    const mime        = file.type || 'application/octet-stream';
    const startTime   = Date.now();
    let   bytesSent   = 0;

    for (let i = 0; i < totalChunks; i++) {
      const start = i * CHUNK_SIZE;
      const end   = Math.min(start + CHUNK_SIZE, file.size || 1);
      const blob  = file.slice(start, end);

      label.textContent = totalChunks > 1
        ? `Sending chunk ${i + 1} / ${totalChunks}`
        : 'Sending…';
      chunk.textContent = totalChunks > 1 ? `${i + 1} of ${totalChunks}` : '';

      const fd = new FormData();
      fd.append('chunk',        blob, file.name);
      fd.append('upload_id',    uploadId);
      fd.append('chunk_index',  i);
      fd.append('total_chunks', totalChunks);
      fd.append('filename',     file.name);
      fd.append('mime_type',    mime);
      fd.append('size_bytes',   file.size || 0);

      let res, data;
      try {
        res  = await fetch('/upload', { method: 'POST', body: fd });
        data = await res.json();
      } catch (e) {
        fill.className    = 'bar-fill err';
        fill.style.width  = '100%';
        label.textContent = 'Network error';
        chunk.textContent = '';
        speed.textContent = '';
        toast('Upload failed: ' + e.message, 'err');
        return;
      }

      if (!res.ok) {
        fill.className    = 'bar-fill err';
        fill.style.width  = '100%';
        label.textContent = 'Error';
        chunk.textContent = '';
        speed.textContent = '';
        toast('Upload error: ' + (data.detail || res.statusText), 'err');
        return;
      }

      bytesSent        += (end - start);
      const elapsed     = Math.max(0.01, (Date.now() - startTime) / 1000);
      speed.textContent = fmtSpeed(bytesSent / elapsed);

      if (data.status === 'received') {
        fill.style.width = data.percent + '%';
        continue;
      }

      if (data.status === 'processing') {
        fill.style.width  = '100%';
        label.textContent = 'Syncing to GitHub…';
        chunk.textContent = '';
        speed.textContent = '';
        syncRow.style.display = '';
        await pollSync(uploadId, file, fill, label, syncFill, syncPct);
        return;
      }

      if (data.status === 'done') {
        fill.className    = 'bar-fill ok';
        fill.style.width  = '100%';
        label.textContent = 'Done ✓';
        chunk.textContent = '';
        speed.textContent = '';
        toast(`${file.name} uploaded`, 'ok');
        loadFiles();
        setTimeout(() => card.classList.remove('visible'), 2200);
        return;
      }

      if (data.status === 'duplicate') {
        fill.className    = 'bar-fill ok';
        fill.style.width  = '100%';
        label.textContent = 'Already stored';
        chunk.textContent = '';
        speed.textContent = '';
        toast(`${file.name} already exists`, 'inf');
        loadFiles();
        setTimeout(() => card.classList.remove('visible'), 2200);
        return;
      }
    }
  }

  async function pollSync(uploadId, file, fill, label, syncFill, syncPct) {
    const card = document.getElementById('uploadCard');
    while (true) {
      await new Promise(r => setTimeout(r, 1500));
      let data;
      try {
        const res = await fetch(`/upload/status/${uploadId}`);
        if (res.status === 404) {
          fill.className        = 'bar-fill ok';
          syncFill.className    = 'sync-fill ok';
          syncFill.style.width  = '100%';
          syncPct.textContent   = '100%';
          label.textContent     = 'Done ✓';
          toast(`${file.name} uploaded`, 'ok');
          loadFiles();
          setTimeout(() => card.classList.remove('visible'), 2200);
          return;
        }
        if (!res.ok) continue;
        data = await res.json();
      } catch {
        continue;
      }

      const pct = data.github_percent ?? 0;
      syncFill.style.width = pct + '%';
      syncPct.textContent  = pct + '%';
      label.textContent    = `Syncing to GitHub… ${pct}%`;

      if (data.status === 'done') {
        fill.className        = 'bar-fill ok';
        syncFill.className    = 'sync-fill ok';
        syncFill.style.width  = '100%';
        syncPct.textContent   = '100%';
        label.textContent     = 'Done ✓';
        toast(`${file.name} uploaded`, 'ok');
        loadFiles();
        setTimeout(() => card.classList.remove('visible'), 2200);
        return;
      }

      if (data.status === 'duplicate') {
        fill.className        = 'bar-fill ok';
        syncFill.className    = 'sync-fill ok';
        syncFill.style.width  = '100%';
        label.textContent     = 'Already stored';
        toast(`${file.name} already exists`, 'inf');
        loadFiles();
        setTimeout(() => card.classList.remove('visible'), 2200);
        return;
      }

      if (data.status === 'error') {
        fill.className    = 'bar-fill err';
        label.textContent = 'Error: ' + data.error;
        toast('Upload error: ' + data.error, 'err');
        return;
      }
    }
  }

  async function startDownload(sha256, filename, mimeType, sizeBytes) {
    const btn = document.getElementById(`dlbtn-${sha256}`);
    const row = document.getElementById(`dlrow-${sha256}`);
    const bar = document.getElementById(`dlbar-${sha256}`);

    btn.disabled      = true;
    btn.textContent   = '…';
    row.style.display = '';
    bar.style.width   = '0%';

    let res;
    try {
      res = await fetch(`/download/${sha256}`);
    } catch (e) {
      row.style.display = 'none';
      btn.disabled      = false;
      btn.textContent   = 'Download';
      toast('Download failed: ' + e.message, 'err');
      return;
    }

    if (!res.ok) {
      row.style.display = 'none';
      btn.disabled      = false;
      btn.textContent   = 'Download';
      toast(`Download error ${res.status}`, 'err');
      return;
    }

    const reader   = res.body.getReader();
    const parts    = [];
    let   received = 0;

    while (true) {
      let c;
      try { c = await reader.read(); } catch { break; }
      if (c.done) break;
      parts.push(c.value);
      received += c.value.length;
      if (sizeBytes > 0) {
        bar.style.width = Math.min(100, Math.round(received / sizeBytes * 100)) + '%';
      }
    }

    const blob = new Blob(parts, { type: mimeType });
    const url  = URL.createObjectURL(blob);
    Object.assign(document.createElement('a'), { href: url, download: filename }).click();
    URL.revokeObjectURL(url);

    row.style.display = 'none';
    btn.disabled      = false;
    btn.textContent   = 'Download';
    toast(`${filename} saved`, 'ok');
  }

  loadFiles();
</script>
</body>
</html>
